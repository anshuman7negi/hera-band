<div class="gallery-container">
  <div class="gallery-header">
    <h1>Wedding Gallery</h1>
    <p>Our Beautiful Memories</p>
  </div>

  <div class="carousel-wrapper">
    <button class="nav-button prev" (click)="previousSlide()" aria-label="Previous">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </button>

    <div class="carousel-container">
      <div class="carousel-track">
        <div
          *ngFor="let photo of visiblePhotos; let i = index"
          [class]="'carousel-item ' + getPhotoClass(i)"
          (click)="openLightbox(photo.url)"
        >
          <div class="photo-card">
            <img [src]="photo.url" [alt]="photo.title" />
            <div class="photo-overlay">
              <span class="photo-title">{{ photo.title }}</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <button class="nav-button next" (click)="nextSlide()" aria-label="Next">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    </button>
  </div>

  <div class="pagination">
    <button
      *ngFor="let photo of photos; let i = index"
      [class.active]="i === currentIndex"
      (click)="goToSlide(i)"
      [attr.aria-label]="'Go to slide ' + (i + 1)"
    ></button>
  </div>
</div>


<!-- video --> 

<div class="lightbox" *ngIf="lightboxOpen" (click)="closeLightbox()">
  <button class="lightbox-close" (click)="closeLightbox()" aria-label="Close">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="18" y1="6" x2="6" y2="18"></line>
      <line x1="6" y1="6" x2="18" y2="18"></line>
    </svg>
  </button>
  <img [src]="lightboxImageUrl" alt="Full size image" (click)="$event.stopPropagation()" />
</div>

<div class="video-gallery-container">
  <h1 class="gallery-title">Wedding Video Gallery</h1>

  <div class="carousel-wrapper">
    <button class="nav-button nav-left" (click)="previousSlideV()" aria-label="Previous video">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </button>

    <div class="carousel-container">
      <div class="carousel-track">
        <div
          *ngFor="let video of videos; let i = index"
          [class]="'carousel-item ' + getVideoPosition(i)"
          (click)="openVideo(video.url)"
        >
          <div class="video-card">
            <img
              [src]="video.thumbnail"
              [alt]="video.title"
              class="video-thumbnail"
            />
            <div class="play-button">
              <svg width="48" height="48" viewBox="0 0 48 48" fill="white">
                <circle cx="24" cy="24" r="22" fill="rgba(0,0,0,0.7)"/>
                <polygon points="18,14 18,34 34,24" fill="white"/>
              </svg>
            </div>
            <div class="video-title">{{ video.title }}</div>
          </div>
        </div>
      </div>
    </div>

    <button class="nav-button nav-right" (click)="nextSlideV()" aria-label="Next video">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    </button>
  </div>

  <div class="pagination-dots">
    <button
      *ngFor="let video of videos; let i = index"
      [class.active]="i === currentIndex"
      (click)="goToSlideV(i)"
      [attr.aria-label]="'Go to video ' + (i + 1)"
      class="dot"
    ></button>
  </div>
</div>
